name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Also bundle the layout XML and zip (about 77 MB) and publish it as the 'latest' release"
        type: boolean
        default: false
      dlc:
        description: "Also bundle the DLC templates (rush, ymo) from the 'Templates' release and publish it as the 'latest' release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Every push builds the lean APK (no layout XML or zip, small download) and publishes it as "newlook".
      # Run the workflow by hand with "full" ticked to build the 77 MB package with the layout files bundled.
      # The layout XML and zip live on the repo's "Assets" release (too big for the repo).
      - name: Fetch the bundled layout files
        if: ${{ inputs.full }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          gh release download Assets --dir app/src/main/assets --clobber || echo "No Assets release; building without a built-in layout."
          ls -la app/src/main/assets

      - name: Fetch the DLC templates
        if: ${{ inputs.dlc }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/templates
          gh release download Templates --dir app/src/main/assets/templates --clobber || echo "No Templates release; building without DLC templates."
          ls -la app/src/main/assets/templates

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurtleBox-GX-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the lean build to the "newlook" release
        if: ${{ !inputs.full && !inputs.dlc }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TurtleBox-GX-newlook.apk
          gh release delete newlook --cleanup-tag --yes || true
          gh release create newlook TurtleBox-GX-newlook.apk \
            --title "TurtleBox GX 0.2.0 (new look)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Small download. On first set-up the app downloads the layout files and optional DLC templates from GitHub into the folder you choose. Installs over the existing app and keeps your folder and settings. The big package with the files bundled is on the latest release." \
            --prerelease

      # The full package, only when asked for.
      - name: Publish the full package to the "latest" release
        if: ${{ inputs.full || inputs.dlc }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TurtleBox-GX.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TurtleBox-GX.apk \
            --title "Latest build" \
            --notes "Full package built from commit ${GITHUB_SHA::7}, with the layout XML and zip bundled (and the DLC templates if that option was ticked). Download TurtleBox-GX.apk and install it." \
            --prerelease
